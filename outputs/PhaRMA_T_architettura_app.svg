<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Architettura applicativa PhaRMA T</title>
  <desc id="desc">Schema dell'architettura frontend-first di PhaRMA T con Vercel, React, Supabase Auth, PostgreSQL, RLS e moduli FMEA, RCA e Gap Analysis.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <style>
      .bg { fill: #f4f7fb; }
      .panel { fill: #ffffff; stroke: #dbe4ef; stroke-width: 1.5; filter: url(#shadow); }
      .panel-soft { fill: #f8fafc; stroke: #dbe4ef; stroke-width: 1.5; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #061126; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 19px; fill: #475569; }
      .section-title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #0f172a; }
      .section-eyebrow { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1px; fill: #64748b; }
      .box-title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
      .box-text { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; fill: #475569; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .pill { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: .6px; }
      .line { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
      .blue { fill: #e0f2fe; stroke: #7dd3fc; }
      .amber { fill: #fef3c7; stroke: #fbbf24; }
      .teal { fill: #ccfbf1; stroke: #5eead4; }
      .green { fill: #dcfce7; stroke: #86efac; }
      .slate { fill: #f1f5f9; stroke: #cbd5e1; }
      .red { fill: #fee2e2; stroke: #fca5a5; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1100"/>

  <rect x="60" y="45" width="1480" height="130" rx="22" fill="url(#hero)" stroke="#dbe4ef" stroke-width="1.5"/>
  <text x="100" y="102" class="title">PhaRMA T - Architettura applicativa</text>
  <text x="100" y="138" class="subtitle">Applicazione SPA frontend-first per risk management: FMEA, RCA e Gap Analysis, con persistenza Supabase e deploy Vercel.</text>
  <g transform="translate(1270 76)">
    <rect x="0" y="0" width="220" height="56" rx="14" fill="#ecfeff" stroke="#99f6e4"/>
    <text x="22" y="24" class="small" font-weight="800">MODELLO</text>
    <text x="22" y="43" class="box-text" font-weight="800" fill="#0f766e">No backend custom</text>
  </g>

  <!-- Development and deployment -->
  <rect x="60" y="220" width="310" height="720" rx="22" class="panel"/>
  <text x="90" y="260" class="section-eyebrow">SVILUPPO E ACCESSO</text>
  <text x="90" y="292" class="section-title">Canali di ingresso</text>

  <g transform="translate(90 335)">
    <rect width="250" height="86" rx="16" class="panel-soft"/>
    <circle cx="35" cy="43" r="21" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="70" y="36" class="box-title">Utente</text>
    <text x="70" y="58" class="box-text">Browser web autenticato</text>
  </g>

  <g transform="translate(90 455)">
    <rect width="250" height="104" rx="16" class="panel-soft"/>
    <circle cx="35" cy="44" r="21" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="70" y="36" class="box-title">Repository</text>
    <text x="70" y="58" class="box-text">Sviluppo in VS Code</text>
    <text x="70" y="78" class="box-text">Versionamento GitHub</text>
  </g>

  <g transform="translate(90 595)">
    <rect width="250" height="104" rx="16" class="panel-soft"/>
    <circle cx="35" cy="44" r="21" fill="#dcfce7" stroke="#86efac"/>
    <text x="70" y="36" class="box-title">Deploy</text>
    <text x="70" y="58" class="box-text">Build automatica</text>
    <text x="70" y="78" class="box-text">Pubblicazione su Vercel</text>
  </g>

  <g transform="translate(90 735)">
    <rect width="250" height="130" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="22" y="34" class="box-title">Fruizione SIFO</text>
    <text x="22" y="60" class="box-text">Link dedicato o dominio</text>
    <text x="22" y="82" class="box-text">Account Supabase SIFO</text>
    <text x="22" y="104" class="box-text">Autonomia gestione utenze</text>
  </g>

  <!-- Frontend -->
  <rect x="430" y="220" width="690" height="720" rx="22" class="panel"/>
  <text x="465" y="260" class="section-eyebrow">FRONTEND</text>
  <text x="465" y="292" class="section-title">React SPA ospitata su Vercel</text>

  <g transform="translate(465 335)">
    <rect width="620" height="90" rx="16" class="blue"/>
    <text x="24" y="34" class="box-title">React + TypeScript + Vite + Tailwind</text>
    <text x="24" y="60" class="box-text">Interfaccia client-side, routing protetto, design system interno e gestione stato locale.</text>
  </g>

  <g transform="translate(465 460)">
    <rect width="190" height="96" rx="16" class="slate"/>
    <text x="20" y="34" class="box-title">Routing</text>
    <text x="20" y="58" class="box-text">React Router</text>
    <text x="20" y="78" class="box-text">Rotte protette</text>
  </g>
  <g transform="translate(680 460)">
    <rect width="190" height="96" rx="16" class="slate"/>
    <text x="20" y="34" class="box-title">AuthContext</text>
    <text x="20" y="58" class="box-text">Sessione utente</text>
    <text x="20" y="78" class="box-text">user.id per query</text>
  </g>
  <g transform="translate(895 460)">
    <rect width="190" height="96" rx="16" class="slate"/>
    <text x="20" y="34" class="box-title">UI kit</text>
    <text x="20" y="58" class="box-text">Card, Button, Badge</text>
    <text x="20" y="78" class="box-text">PageHeader, StatCard</text>
  </g>

  <g transform="translate(465 600)">
    <rect width="190" height="150" rx="18" class="blue"/>
    <text x="20" y="35" class="box-title">FMEA</text>
    <text x="20" y="62" class="box-text">Assessment rischi</text>
    <text x="20" y="84" class="box-text">Catalogo rischi</text>
    <text x="20" y="106" class="box-text">Azioni correttive</text>
    <text x="20" y="128" class="box-text">PDF / Excel / PNG</text>
  </g>
  <g transform="translate(680 600)">
    <rect width="190" height="150" rx="18" class="amber"/>
    <text x="20" y="35" class="box-title">RCA</text>
    <text x="20" y="62" class="box-text">Evento e cause</text>
    <text x="20" y="84" class="box-text">Ishikawa</text>
    <text x="20" y="106" class="box-text">5 Whys</text>
    <text x="20" y="128" class="box-text">Report ed export</text>
  </g>
  <g transform="translate(895 600)">
    <rect width="190" height="150" rx="18" class="teal"/>
    <text x="20" y="35" class="box-title">Gap Analysis</text>
    <text x="20" y="62" class="box-text">Processi e norme</text>
    <text x="20" y="84" class="box-text">Valutazioni</text>
    <text x="20" y="106" class="box-text">Azioni e Gantt</text>
    <text x="20" y="128" class="box-text">Report ed export</text>
  </g>

  <g transform="translate(465 790)">
    <rect width="300" height="88" rx="16" class="green"/>
    <text x="22" y="34" class="box-title">Export client-side</text>
    <text x="22" y="58" class="box-text">PDF, Excel, PNG, JSON GDPR</text>
  </g>
  <g transform="translate(785 790)">
    <rect width="300" height="88" rx="16" class="red"/>
    <text x="22" y="34" class="box-title">Limitazioni operative</text>
    <text x="22" y="58" class="box-text">Uso formativo, metodologico e documentale</text>
  </g>

  <!-- Supabase -->
  <rect x="1180" y="220" width="360" height="720" rx="22" class="panel"/>
  <text x="1210" y="260" class="section-eyebrow">BACKEND GESTITO</text>
  <text x="1210" y="292" class="section-title">Supabase</text>

  <g transform="translate(1210 335)">
    <rect width="300" height="110" rx="16" class="green"/>
    <text x="22" y="36" class="box-title">Supabase Auth</text>
    <text x="22" y="62" class="box-text">Login, registrazione</text>
    <text x="22" y="84" class="box-text">Email verification e policy password</text>
  </g>

  <g transform="translate(1210 480)">
    <rect width="300" height="150" rx="16" class="teal"/>
    <text x="22" y="36" class="box-title">PostgreSQL</text>
    <text x="22" y="62" class="box-text">Tabelle FMEA</text>
    <text x="22" y="84" class="box-text">Tabelle RCA</text>
    <text x="22" y="106" class="box-text">Tabelle Gap Analysis</text>
    <text x="22" y="128" class="box-text">Dati separati per user_id</text>
  </g>

  <g transform="translate(1210 665)">
    <rect width="300" height="110" rx="16" class="amber"/>
    <text x="22" y="36" class="box-title">RLS</text>
    <text x="22" y="62" class="box-text">Policy per select / insert</text>
    <text x="22" y="84" class="box-text">update / delete su righe utente</text>
  </g>

  <g transform="translate(1210 810)">
    <rect width="300" height="82" rx="16" class="slate"/>
    <text x="22" y="34" class="box-title">Fornitori esterni</text>
    <text x="22" y="58" class="box-text">Vercel hosting + Supabase DB/Auth</text>
  </g>

  <!-- arrows -->
  <path class="line" d="M 340 378 C 385 378, 390 378, 430 378"/>
  <path class="line" d="M 340 647 C 385 647, 390 380, 430 380"/>
  <path class="line" d="M 1120 382 C 1150 382, 1150 390, 1180 390"/>
  <path class="line" d="M 1120 520 C 1150 520, 1150 545, 1180 545"/>
  <path class="line" d="M 1120 666 C 1150 666, 1150 720, 1180 720"/>
  <path class="line-soft" d="M 615 790 C 650 760, 700 760, 735 750"/>
  <path class="line-soft" d="M 830 790 C 860 760, 910 760, 945 750"/>

  <!-- footer -->
  <rect x="60" y="985" width="1480" height="70" rx="18" fill="#ffffff" stroke="#dbe4ef"/>
  <text x="90" y="1020" class="box-text">
    Principio architetturale: applicazione frontend-first, senza backend custom. La sicurezza dei dati si basa su autenticazione Supabase, query filtrate per utente e Row Level Security sul database.
  </text>
</svg>
